<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 837.34 299" width="837.34" height="299" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
<title id="t">Cache-aside: the read path</title>
<desc id="d">Cache aside read path diagram: the application checks the cache first, returns immediately on a hit in about one millisecond, and on a miss queries the database in about eighty milliseconds then writes the value back into the cache with a time to live.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171450"/></marker>
<marker id="ah-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#171450"/></marker>
</defs>
<rect width="837.34" height="299" fill="#FAFAF5"/>
<text x="26" y="37" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="start" letter-spacing="1.4">SYSTEM DESIGN</text><text x="26" y="63" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#0D0B33" text-anchor="start">Cache-aside: the read path</text><rect x="26" y="75" width="86" height="4" rx="2" fill="#5553FF"/><text x="26" y="99" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B5885" text-anchor="start">The application owns the cache. The database is only touched on a miss.</text><text x="95" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">REQUEST</text><text x="310.78" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">STEP 1</text><text x="742.34" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">STEP 3</text><line x1="164" y1="172" x2="241.78" y2="172" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><rect x="186.45" y="157" width="32.89" height="15" rx="7" fill="#FAFAF5" stroke="#C9C7F0" stroke-width="1"/><text x="202.89" y="167.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5B5885" text-anchor="middle">read</text><line x1="379.78" y1="172" x2="457.56" y2="172" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5 4" opacity="0.72"/><rect x="393.64" y="157" width="50.06" height="15" rx="7" fill="#FAFAF5" stroke="#C9C7F0" stroke-width="1"/><text x="418.67" y="167.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5B5885" text-anchor="middle">on miss</text><line x1="595.56" y1="172" x2="673.34" y2="172" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><rect x="606.56" y="157" width="55.78" height="15" rx="7" fill="#FAFAF5" stroke="#C9C7F0" stroke-width="1"/><text x="634.45" y="167.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5B5885" text-anchor="middle">populate</text><rect x="26" y="141" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="95" y="176.05" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">App server</text><rect x="241.78" y="141" width="138" height="62" rx="10" fill="#E7F5F0" stroke="#047857" stroke-width="1.5"/><text x="310.78" y="167.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Cache</text><text x="310.78" y="194.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#047857" text-anchor="middle">hit → return, ~1 ms</text><rect x="457.56" y="141" width="138" height="62" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.5"/><text x="526.56" y="167.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Database</text><text x="526.56" y="194.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#DC2626" text-anchor="middle">miss → query, ~80 ms</text><rect x="673.34" y="141" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="742.34" y="167.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Write back</text><text x="742.34" y="194.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">set key with TTL</text><path d="M310.78,225 Q312.2,202.46 310.78,209" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/><path d="M309.34,202.15 L310.78,209 L314.92,203.36" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><text x="233.23" y="237" font-family="Noteworthy, 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive" font-size="15" fill="#B45309" text-anchor="start" transform="rotate(-1.2 233.23 237)">95% of reads stop here</text><path d="M532.56,121 Q525.87,110.68 526.56,136" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/><path d="M523.53,129.69 L526.56,136 L529.24,129.53" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><text x="440.91" y="115" font-family="Noteworthy, 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive" font-size="15" fill="#B45309" text-anchor="start" transform="rotate(-1.2 440.91 115)">only 1 in 20 gets this far</text><rect x="0" y="273" width="837.34" height="26" fill="#5553FF"/><polygon points="150.72,273 180.72,273 165.72,286" fill="#FAFAF5"/><text x="819.34" y="290" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#E6E5FF" text-anchor="end">anandrochlani.com  ·  System Design Tutorial</text>
</svg>