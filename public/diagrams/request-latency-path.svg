<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1121.79 377" width="1121.79" height="377" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
<title id="t">Where latency actually comes from</title>
<desc id="d">Diagram of a web request passing through DNS lookup, CDN edge, load balancer, application server, cache and database, with typical latency added at each hop, totalling roughly 150 milliseconds.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171450"/></marker>
<marker id="ah-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#171450"/></marker>
</defs>
<rect width="1121.79" height="377" fill="#FAFAF5"/>
<text x="26" y="37" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="start" letter-spacing="1.4">SYSTEM DESIGN</text><text x="26" y="63" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#0D0B33" text-anchor="start">Where latency actually comes from</text><rect x="26" y="75" width="86" height="4" rx="2" fill="#5553FF"/><text x="26" y="99" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B5885" text-anchor="start">A single user request, hop by hop, with a typical time cost at each stage.</text><text x="95" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">CLIENT</text><text x="327.95" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">RESOLVE</text><text x="560.9" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">EDGE</text><text x="793.84" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">COMPUTE</text><line x1="164" y1="211" x2="258.95" y2="211" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><rect x="189.31" y="196" width="44.34" height="15" rx="7" fill="#FAFAF5" stroke="#C9C7F0" stroke-width="1"/><text x="211.47" y="206.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5B5885" text-anchor="middle">lookup</text><line x1="396.95" y1="211" x2="491.9" y2="211" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><rect x="407.95" y="196" width="72.95" height="15" rx="7" fill="#FAFAF5" stroke="#C9C7F0" stroke-width="1"/><text x="444.42" y="206.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5B5885" text-anchor="middle">TLS + route</text><line x1="629.9" y1="211" x2="724.84" y2="211" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="862.84" y1="211" x2="957.79" y2="172" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="862.84" y1="211" x2="957.79" y2="250" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><rect x="26" y="180" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="95" y="206.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Browser</text><text x="95" y="233.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">user request</text><rect x="258.95" y="180" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="327.95" y="206.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">DNS</text><text x="327.95" y="233.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">~20 ms</text><rect x="491.9" y="180" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="560.9" y="206.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">CDN / LB</text><text x="560.9" y="233.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">~10 ms</text><rect x="724.84" y="180" width="138" height="62" rx="10" fill="#5553FF" stroke="#4341D6" stroke-width="1.5"/><text x="793.84" y="206.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">App server</text><text x="793.84" y="233.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#DCDBFF" text-anchor="middle">~30 ms</text><rect x="957.79" y="141" width="138" height="62" rx="10" fill="#E7F5F0" stroke="#047857" stroke-width="1.5"/><text x="1026.79" y="167.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Cache</text><text x="1026.79" y="194.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#047857" text-anchor="middle">~1 ms</text><rect x="957.79" y="219" width="138" height="62" rx="10" fill="#FDECEC" stroke="#DC2626" stroke-width="1.5"/><text x="1026.79" y="245.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Database</text><text x="1026.79" y="272.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#DC2626" text-anchor="middle">~80 ms</text><path d="M997.09,303 Q1003.05,276.14 1026.79,287" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/><path d="M1019.79,286.94 L1026.79,287 L1022.16,281.75" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><text x="898.39" y="315" font-family="Noteworthy, 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive" font-size="15" fill="#B45309" text-anchor="start" transform="rotate(-1.2 898.39 315)">half your budget, right here</text><path d="M1016.79,121 Q1014.89,110.55 1026.79,136" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/><path d="M1021.5,131.42 L1026.79,136 L1026.67,129" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/><text x="963.92" y="115" font-family="Noteworthy, 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive" font-size="15" fill="#B45309" text-anchor="start" transform="rotate(-1.2 963.92 115)">skip this hop →</text><rect x="0" y="351" width="1121.79" height="26" fill="#5553FF"/><polygon points="201.92,351 231.92,351 216.92,364" fill="#FAFAF5"/><text x="1103.79" y="368" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#E6E5FF" text-anchor="end">anandrochlani.com  ·  System Design Tutorial</text>
