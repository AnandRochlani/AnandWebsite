<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 438.45000000000005" width="838" height="438.45000000000005" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
<title id="t">Microservices: one gateway, many owners</title>
<desc id="d">Microservices diagram showing clients calling an API gateway that routes to a user service, order service and payment service, each owning its own separate database, with an event bus connecting the services asynchronously.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171450"/></marker>
<marker id="ah-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#171450"/></marker>
</defs>
<rect width="838" height="438.45000000000005" fill="#FAFAF5"/>
<text x="26" y="37" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="start" letter-spacing="1.4">SYSTEM DESIGN</text><text x="26" y="63" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#0D0B33" text-anchor="start">Microservices: one gateway, many owners</text><rect x="26" y="75" width="86" height="4" rx="2" fill="#5553FF"/><text x="26" y="99" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B5885" text-anchor="start">Each service owns its data. No service reaches into another service’s database.</text><text x="95" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">CLIENTS</text><text x="311" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">ENTRY</text><text x="527" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">SERVICES</text><text x="743" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">PRIVATE DATA</text><line x1="164" y1="263.73" x2="242" y2="263.73" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="380" y1="263.73" x2="458" y2="176.58" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="380" y1="263.73" x2="458" y2="263.73" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="380" y1="263.73" x2="458" y2="350.88" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="596" y1="176.58" x2="674" y2="176.58" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="596" y1="263.73" x2="674" y2="263.73" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="596" y1="350.88" x2="674" y2="350.88" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><rect x="618.55" y="256.23" width="32.89" height="15" rx="7" fill="#FAFAF5" stroke="#C9C7F0"/><text x="635" y="266.73" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5B5885" text-anchor="middle">owns</text><rect x="26" y="228.15" width="138" height="71.15" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="95" y="267.78" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Web / Mobile</text><rect x="242" y="228.15" width="138" height="71.15" rx="10" fill="#5553FF" stroke="#4341D6" stroke-width="1.5"/><text x="311" y="251.98" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">API gateway</text><text x="311" y="279.43" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#DCDBFF" text-anchor="middle">auth, routing,</text><text x="311" y="293.73" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#DCDBFF" text-anchor="middle">limits</text><rect x="458" y="141" width="138" height="71.15" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="527" y="180.62" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">User service</text><rect x="458" y="228.15" width="138" height="71.15" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="527" y="267.78" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Order service</text><rect x="458" y="315.3" width="138" height="71.15" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="527" y="354.93" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Payment service</text><rect x="674" y="141" width="138" height="71.15" rx="10" fill="#E7F5F0" stroke="#047857" stroke-width="1.5"/><text x="743" y="180.62" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Users DB</text><rect x="674" y="228.15" width="138" height="71.15" rx="10" fill="#E7F5F0" stroke="#047857" stroke-width="1.5"/><text x="743" y="267.78" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Orders DB</text><rect x="674" y="315.3" width="138" height="71.15" rx="10" fill="#E7F5F0" stroke="#047857" stroke-width="1.5"/><text x="743" y="354.93" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Payments DB</text><rect x="0" y="412.45" width="838" height="26" fill="#5553FF"/><polygon points="150.84,412.45 180.84,412.45 165.84,425.45" fill="#FAFAF5"/><text x="820" y="429.45" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#E6E5FF" text-anchor="end">anandrochlani.com  ·  System Design Tutorial</text>
