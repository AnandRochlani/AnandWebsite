<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1054 455" width="1054" height="455" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
<title id="t">Judging submissions without melting the API</title>
<desc id="d">Coding contest platform architecture: a user submits code to the API, which enqueues the submission in a message queue and returns immediately, sandboxed judge workers pull jobs and run test cases, and results are written to a results store that updates a cached leaderboard.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171450"/></marker>
<marker id="ah-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#171450"/></marker>
</defs>
<rect width="1054" height="455" fill="#FAFAF5"/>
<text x="26" y="37" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="start" letter-spacing="1.4">SYSTEM DESIGN</text><text x="26" y="63" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#0D0B33" text-anchor="start">Judging submissions without melting the API</text><rect x="26" y="75" width="86" height="4" rx="2" fill="#5553FF"/><text x="26" y="99" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B5885" text-anchor="start">Code execution is slow and untrusted, so it never happens inline.</text><text x="95" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">USER</text><text x="311" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">API</text><text x="527" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">BUFFER</text><text x="743" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">EXECUTION</text><text x="959" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">RESULTS</text><line x1="164" y1="250" x2="242" y2="250" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="380" y1="250" x2="458" y2="250" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><rect x="393.97" y="235" width="50.06" height="15" rx="7" fill="#FAFAF5" stroke="#C9C7F0" stroke-width="1"/><text x="419" y="245.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5B5885" text-anchor="middle">enqueue</text><line x1="596" y1="250" x2="674" y2="172" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="596" y1="250" x2="674" y2="250" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="596" y1="250" x2="674" y2="328" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="826" y1="172" x2="826" y2="328" stroke="#171450" stroke-width="1.6" opacity="0.72"/><line x1="812" y1="172" x2="826" y2="172" stroke="#171450" stroke-width="1.6" opacity="0.72"/><line x1="812" y1="250" x2="826" y2="250" stroke="#171450" stroke-width="1.6" opacity="0.72"/><line x1="812" y1="328" x2="826" y2="328" stroke="#171450" stroke-width="1.6" opacity="0.72"/><line x1="876" y1="211" x2="876" y2="289" stroke="#171450" stroke-width="1.6" opacity="0.72"/><line x1="876" y1="211" x2="890" y2="211" stroke="#171450" stroke-width="1.6" opacity="0.72" marker-end="url(#ah)"/><line x1="876" y1="289" x2="890" y2="289" stroke="#171450" stroke-width="1.6" opacity="0.72" marker-end="url(#ah)"/><line x1="826" y1="250" x2="876" y2="250" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><rect x="825.97" y="235" width="50.06" height="15" rx="7" fill="#FAFAF5" stroke="#C9C7F0" stroke-width="1"/><text x="851" y="245.5" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#5B5885" text-anchor="middle">verdict</text><rect x="26" y="219" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="95" y="254.05" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Submit code</text><rect x="242" y="219" width="138" height="62" rx="10" fill="#5553FF" stroke="#4341D6" stroke-width="1.5"/><text x="311" y="245.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Submission API</text><text x="311" y="272.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#DCDBFF" text-anchor="middle">returns job ID</text><rect x="458" y="219" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="527" y="245.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Message queue</text><text x="527" y="272.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">absorbs spikes</text><rect x="674" y="141" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="743" y="167.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Judge worker</text><text x="743" y="194.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">sandboxed</text><rect x="674" y="219" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="743" y="245.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Judge worker</text><text x="743" y="272.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">sandboxed</text><rect x="674" y="297" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="743" y="323.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Judge worker</text><text x="743" y="350.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">sandboxed</text><rect x="890" y="180" width="138" height="62" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="959" y="215.05" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Results store</text><rect x="890" y="258" width="138" height="62" rx="10" fill="#E7F5F0" stroke="#047857" stroke-width="1.5"/><text x="959" y="284.4" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Leaderboard</text><text x="959" y="311.85" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#047857" text-anchor="middle">cached, sorted set</text><path d="M527,303 Q524,275.3 527,287" stroke="#B45309" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85"/><path d="M522.6