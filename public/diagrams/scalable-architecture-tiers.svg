App server</text><rect x="707.68" y="141" width="138" height="88.7" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="776.68" y="180.75" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Cache</text><text x="776.68" y="208.2" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">Redis</text><rect x="707.68" y="245.7" width="138" height="88.7" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="776.68" y="285.45" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Database</text><text x="776.68" y="312.9" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">primary + replicas</text><rect x="707.68" y="350.4" width="138" height="88.7" rx="10" fill="#EEEEFF" stroke="#5553FF" stroke-width="1.5"/><text x="776.68" y="390.15" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="600" fill="#0D0B33" text-anchor="middle">Object store</text><text x="776.68" y="417.6" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B5885" text-anchor="middle">S3</text><rect x="0" y="465.1" width="871.675" height="26" fill="#5553FF"/><polygon points="156.9,465.1 186.9,465.1 171.9,478.1" fill="#FAFAF5"/><text x="853.68" y="482.1" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#E6E5FF" text-anchor="end">anandrochlani.com  ·  System Design Tutorial</text>
