<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 871.675 491.1" width="871.675" height="491.1" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMid meet">
<title id="t">The shape almost every scalable system takes</title>
<desc id="d">Architecture diagram showing clients connecting through a CDN and load balancer to three stateless application servers, which read from a cache and a primary database with read replicas and object storage.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#171450"/></marker>
<marker id="ah-rev" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10,0 L0,5 L10,10 z" fill="#171450"/></marker>
</defs>
<rect width="871.675" height="491.1" fill="#FAFAF5"/>
<text x="26" y="37" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="start" letter-spacing="1.4">SYSTEM DESIGN</text><text x="26" y="63" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#0D0B33" text-anchor="start">The shape almost every scalable system takes</text><rect x="26" y="75" width="86" height="4" rx="2" fill="#5553FF"/><text x="26" y="99" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B5885" text-anchor="start">Stateless compute in the middle, shared state pushed to the edges.</text><text x="95" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">CLIENTS</text><text x="322.23" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">EDGE</text><text x="549.45" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">STATELESS TIER</text><text x="776.68" y="129" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#5B5885" text-anchor="middle" letter-spacing="0.8">STATE</text><line x1="164" y1="237.7" x2="253.23" y2="290.05" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="164" y1="342.4" x2="253.23" y2="290.05" stroke="#171450" stroke-width="1.6" marker-end="url(#ah)" opacity="0.72"/><line x1="391.23" y1="2