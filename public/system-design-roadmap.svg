<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">System Design interview learning roadmap</title>
  <desc id="desc">A five-step roadmap from requirements and estimation through core building blocks, data design, architecture case studies, and interview practice.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <text x="70" y="90" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="700">System Design Interview Roadmap</text>
  <text x="70" y="132" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="22">Learn in this order so every new concept has a reason to exist.</text>
  <path d="M170 322 H1030" stroke="#818cf8" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(170 322)"><circle r="58" fill="#4f46e5"/><text y="10" fill="#fff" font-size="30" font-weight="700">1</text><text y="105" fill="#fff" font-size="20" font-weight="700">Requirements</text><text y="134" fill="#cbd5e1" font-size="16">scope · constraints</text></g>
    <g transform="translate(385 322)"><circle r="58" fill="#6366f1"/><text y="10" fill="#fff" font-size="30" font-weight="700">2</text><text y="105" fill="#fff" font-size="20" font-weight="700">Estimation</text><text y="134" fill="#cbd5e1" font-size="16">QPS · storage</text></g>
    <g transform="translate(600 322)"><circle r="58" fill="#7c3aed"/><text y="10" fill="#fff" font-size="30" font-weight="700">3</text><text y="105" fill="#fff" font-size="20" font-weight="700">Building blocks</text><text y="134" fill="#cbd5e1" font-size="16">cache · queue · CDN</text></g>
    <g transform="translate(815 322)"><circle r="58" fill="#8b5cf6"/><text y="10" fill="#fff" font-size="30" font-weight="700">4</text><text y="105" fill="#fff" font-size="20" font-weight="700">Case studies</text><text y="134" fill="#cbd5e1" font-size="16">design end to end</text></g>
    <g transform="translate(1030 322)"><circle r="58" fill="#a855f7"/><text y="10" fill="#fff" font-size="30" font-weight="700">5</text><text y="105" fill="#fff" font-size="20" font-weight="700">Mock interview</text><text y="134" fill="#cbd5e1" font-size="16">explain trade-offs</text></g>
  </g>
  <rect x="70" y="520" width="1060" height="58" rx="18" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="600" y="557" text-anchor="middle" fill="#e2e8f0" font-family="Inter,Arial,sans-serif" font-size="20">Requirements → numbers → components → complete designs → clear communication</text>
</svg>
